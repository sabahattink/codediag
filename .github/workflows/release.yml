name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify the tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "${TAG#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm run check
      # npm trusted publishing (OIDC, no stored token) needs npm 11.5.1 or newer.
      - name: Update npm for trusted publishing
        run: npm install --global npm@^11.5.1
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Attach the VS Code extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm run extension:package
          gh release upload "$TAG" artifacts/*.vsix --clobber
      # The registry checks server.json against mcpName in the published npm
      # package, so wait until npm serves this version. GitHub OIDC
      # authenticates the io.github.sabahattink namespace; no secret needed.
      - name: Publish to the MCP Registry
        env:
          TAG: ${{ github.event.release.tag_name }}
          PUBLISHER_URL: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.7/mcp-publisher_linux_amd64.tar.gz
          PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
        run: |
          curl -sSfL "$PUBLISHER_URL" -o mcp-publisher.tar.gz
          echo "$PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          for attempt in $(seq 1 30); do
            npm view "@sabahattink/codediag@${TAG#v}" version >/dev/null 2>&1 && break
            sleep 20
          done
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
