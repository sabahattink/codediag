name: CodeDiag project health scan
description: Scan a Node.js project and enforce a minimum health score.
author: Sabahattin Kalkan

inputs:
  path:
    description: Project directory to scan, relative to the repository workspace.
    required: false
    default: .
  threshold:
    description: Minimum passing score from 0 to 100.
    required: false
    default: "70"
  fail-on:
    description: >-
      Fail on any active finding at or above this severity (critical,
      warning, or info), whatever the score. Overrides `failOn` in
      .codediag.yml. Suppressed and baseline findings do not count.
    required: false
    default: ""
  report:
    description: JSON report path, relative to the repository workspace.
    required: false
    default: codediag-report.json
  sarif:
    description: SARIF report path, relative to the repository workspace.
    required: false
    default: codediag-report.sarif
  baseline:
    description: >-
      Optional CodeDiag JSON report, relative to the repository workspace.
      Findings it contains are reported as baseline and do not affect the
      score, threshold, or annotations.
    required: false
    default: ""
  compare:
    description: >-
      Optional CodeDiag JSON report of the base branch, relative to the
      repository workspace. The pull request comment and job summary then
      show the score change against it and which findings are new or fixed.
    required: false
    default: ""
  workspaces:
    description: >-
      Scan every workspace package (npm, pnpm, Yarn, Lerna, or Nx) below
      `path` and combine the reports. Findings are reported with paths
      relative to `path`.
    required: false
    default: "false"
  package-threshold:
    description: >-
      With `workspaces: true`, the minimum score of every workspace package.
      A package below it fails the job even when the combined score passes.
      Overrides `packageThreshold` in .codediag.yml.
    required: false
    default: ""
  secret-history:
    description: >-
      Also report secrets that recent commits added and the current tree no
      longer has: `true` reads the last 1000 commits, a number sets the
      limit, and `false` turns off `secretHistory` from .codediag.yml. Empty
      uses the configuration. Needs actions/checkout with `fetch-depth: 0`;
      a shallow checkout only has its most recent commits.
    required: false
    default: ""
  comment:
    description: >-
      Post one pull request comment with the score, its change since the last
      run, and the findings in files the pull request changes, updating it on
      every push. Needs `pull-requests: write` permission.
    required: false
    default: "false"
  github-token:
    description: Token used to read changed files and write the comment.
    required: false
    default: ${{ github.token }}

outputs:
  score:
    description: Overall CodeDiag score.
  grade:
    description: Overall CodeDiag grade.
  report:
    description: Absolute path to the generated JSON report.
  sarif:
    description: Absolute path to the generated SARIF report.

runs:
  using: node24
  main: dist/action.cjs

branding:
  icon: activity
  color: purple
